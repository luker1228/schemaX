# memorix.yml - Memorix configuration
#
# Behavior settings live here. Secrets belong in .env
# Generated by: memorix init --project
# Date: 2026-07-20

llm:
  provider: openai
  model: gpt-4o-mini

embedding:
  provider: api
  # model: text-embedding-3-small

git:
  autoHook: true
  ingestOnCommit: true
  maxDiffSize: 500
  skipMergeCommits: true
  # excludePatterns:
  #   - "*.lock"
  #   - "dist/**"

behavior:
  sessionInject: minimal
  syncAdvisory: true
  autoCleanup: true
  formationMode: active

server:
  transport: stdio
  dashboard: true
  dashboardPort: 3210
